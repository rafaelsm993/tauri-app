# Same gate as local `npm run verify`. Runs on pushes to main and PRs into main/release/*.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*"]

env:
  # env!() needs these at compile time; CI never calls the real APIs.
  TMDB_API_KEY: ci-dummy
  RAWG_API_KEY: ci-dummy

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
